<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseTask — Animated Daily Task & Submission Reminder</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #05070d;
      --card-glass: rgba(16, 22, 36, 0.65);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-border-hover: rgba(129, 140, 248, 0.45);
      --primary: #6366f1;
      --primary-cyan: #06b6d4;
      --primary-pink: #ec4899;
      --gradient-brand: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      --gradient-text: linear-gradient(120deg, #ffffff 30%, #a5b4fc 70%, #f472b6 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --danger: #f43f5e;
      --warning: #fbbf24;
      --success: #10b981;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 36px 16px 80px;
      position: relative;
      overflow-x: hidden;
    }

    /* ================================================= */
    /* Dynamic Animated Aurora Background               */
    /* ================================================= */
    .aurora-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .aurora-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.45;
      mix-blend-mode: screen;
      will-change: transform;
      animation: floatOrbit 22s infinite alternate ease-in-out;
    }

    .orb-indigo {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, #6366f1 0%, transparent 70%);
      top: -10%;
      left: -10%;
      animation-duration: 18s;
    }

    .orb-cyan {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
      bottom: 5%;
      right: -8%;
      animation-duration: 24s;
      animation-delay: -5s;
    }

    .orb-pink {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #ec4899 0%, transparent 70%);
      top: 40%;
      left: 60%;
      animation-duration: 20s;
      animation-delay: -10s;
    }

    .orb-violet {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
      bottom: -10%;
      left: 15%;
      animation-duration: 26s;
      animation-delay: -14s;
    }

    /* Ambient Cyber Grid Overlay */
    .grid-matrix {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.6;
    }

    @keyframes floatOrbit {
      0% {
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
      }
      50% {
        transform: translate3d(80px, 60px, 0) scale(1.15) rotate(120deg);
      }
      100% {
        transform: translate3d(-60px, 100px, 0) scale(0.9) rotate(240deg);
      }
    }

    /* ================================================= */
    /* Application Shell & Cards                         */
    /* ================================================= */
    .app-viewport {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Glass Effect Utility */
    .glass-surface {
      background: var(--card-glass);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--gradient-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
      position: relative;
    }

    .brand-icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .badge-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .badge-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .badge-btn.active {
      border-color: var(--success);
      color: var(--success);
      background: rgba(16, 185, 129, 0.1);
    }

    /* Stats Grid */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .metric-card {
      padding: 18px 20px;
      border-radius: var(--radius-md);
      position: relative;
      overflow: hidden;
    }

    .metric-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--gradient-brand);
      opacity: 0.6;
    }

    .metric-name {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .metric-number {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-top: 6px;
    }

    .progress-bar-slot {
      margin-top: 8px;
      height: 5px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-glow {
      height: 100%;
      background: var(--gradient-brand);
      width: 0%;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.8);
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Composer */
    .composer {
      padding: 22px;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .composer:hover {
      border-color: var(--card-border-hover);
    }

    .composer-input {
      background: transparent;
      border: none;
      outline: none;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-main);
      width: 100%;
    }

    .composer-input::placeholder {
      color: var(--text-dim);
    }

    .composer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .composer-fields {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .field-styled {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .field-styled:focus {
      border-color: var(--primary);
      color: #fff;
    }

    .btn-submit {
      background: var(--gradient-brand);
      border: none;
      color: #fff;
      font-size: 0.86rem;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.4);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(168, 85, 247, 0.6);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* List Navigation / Filters */
    .stream-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 40px;
      border: 1px solid var(--card-border);
    }

    .filter-tab {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-tab.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }

    .search-input-wrap {
      position: relative;
    }

    .search-input-wrap input {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      border-radius: 40px;
      padding: 7px 14px 7px 32px;
      color: #fff;
      font-size: 0.84rem;
      outline: none;
      width: 170px;
      transition: all 0.25s ease;
    }

    .search-input-wrap input:focus {
      width: 210px;
      border-color: var(--primary);
    }

    .search-input-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      stroke: var(--text-dim);
    }

    /* Task Card Item */
    .task-stream {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .task-card:hover {
      border-color: var(--card-border-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.1);
    }

    .task-card.is-done {
      opacity: 0.5;
    }

    .task-card.is-done .task-title {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }

    /* Animated Checkbox */
    .checkbox-glow {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 7px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      background: rgba(0, 0, 0, 0.2);
    }

    .checkbox-glow:hover {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
    }

    .task-card.is-done .checkbox-glow {
      background: var(--gradient-brand);
      border-color: transparent;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
    }

    .checkbox-glow svg {
      width: 12px;
      height: 12px;
      stroke: #fff;
      stroke-width: 3.5;
      display: none;
    }

    .task-card.is-done .checkbox-glow svg {
      display: block;
    }

    .task-details {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .task-title {
      font-size: 0.98rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .tag-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .tag-priority-high { background: rgba(244, 63, 94, 0.15); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }
    .tag-priority-medium { background: rgba(251, 191, 36, 0.15); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.3); }
    .tag-priority-low { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

    .tag-countdown {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .tag-overdue {
      background: rgba(244, 63, 94, 0.2);
      border: 1px solid var(--danger);
      color: var(--danger);
      animation: alertPulse 1.8s infinite;
    }

    @keyframes alertPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(0.97); }
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: rgba(244, 63, 94, 0.15);
    }

    /* Empty state */
    .empty-state {
      padding: 50px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-halo {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.15);
    }

    .empty-state h3 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .empty-state p {
      font-size: 0.85rem;
      color: var(--text-muted);
      max-width: 320px;
    }

    /* Floating Toast */
    .toast-pill {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: rgba(16, 22, 36, 0.9);
      border: 1px solid var(--primary);
      backdrop-filter: blur(20px);
      padding: 12px 24px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(99, 102, 241, 0.4);
      z-index: 999;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast-pill.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .toast-beacon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 12px var(--danger);
      animation: alertPulse 1.2s infinite;
    }
  </style>
</head>
<body>

  <!-- Dynamic Ambient Animated Background -->
  <div class="aurora-canvas">
    <div class="aurora-orb orb-indigo"></div>
    <div class="aurora-orb orb-cyan"></div>
    <div class="aurora-orb orb-pink"></div>
    <div class="aurora-orb orb-violet"></div>
    <div class="grid-matrix"></div>
  </div>

  <!-- Main Viewport Shell -->
  <div class="app-viewport">
    
    <!-- Top Header -->
    <header class="header-bar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
        </div>
        <div>
          <div class="brand-title">TO DO</div>
          <div class="brand-subtitle">Smart Submissions & Daily Reminders</div>
        </div>
      </div>
      <button class="badge-btn" id="notif-btn" onclick="activateNotifications()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span id="notif-label">Enable Reminders</span>
      </button>
    </header>

    <!-- Metrics Strip -->
    <div class="metric-grid">
      <div class="metric-card glass-surface">
        <div class="metric-name">Completion Rate</div>
        <div class="metric-number" id="metric-percent">0%</div>
        <div class="progress-bar-slot">
          <div class="progress-bar-glow" id="metric-progress"></div>
        </div>
      </div>
      <div class="metric-card glass-surface">
        <div class="metric-name">Due Today</div>
        <div class="metric-number" id="metric-today">0</div>
      </div>
      <div class="metric-card glass-surface">
        <div class="metric-name">Active Pending</div>
        <div class="metric-number" id="metric-pending">0</div>
      </div>
      <div class="metric-card glass-surface">
        <div class="metric-name">Finished</div>
        <div class="metric-number" id="metric-finished">0</div>
      </div>
    </div>

    <!-- Quick Task Composer Form -->
    <form class="composer glass-surface" onsubmit="handleNewTask(event)">
      <input 
        type="text" 
        id="composer-input" 
        class="composer-input" 
        placeholder="Type a daily task or submission deadline (e.g., Deliver Quarterly Report)..." 
        required 
      />
      <div class="composer-row">
        <div class="composer-fields">
          <input type="datetime-local" id="composer-time" class="field-styled" required />
          <select id="composer-priority" class="field-styled">
            <option value="high">High Priority</option>
            <option value="medium" selected>Medium Priority</option>
            <option value="low">Low Priority</option>
          </select>
          <select id="composer-offset" class="field-styled">
            <option value="0">At Deadline</option>
            <option value="5">5 Mins Before</option>
            <option value="15">15 Mins Before</option>
          </select>
        </div>
        <button type="submit" class="btn-submit">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Schedule Task
        </button>
      </div>
    </form>

    <!-- Filter Hub -->
    <div class="stream-header">
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
        <button class="filter-tab" onclick="setFilter('pending', this)">Pending</button>
        <button class="filter-tab" onclick="setFilter('today', this)">Due Today</button>
        <button class="filter-tab" onclick="setFilter('completed', this)">Completed</button>
      </div>
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" placeholder="Filter tasks..." oninput="handleFilterSearch(this.value)" />
      </div>
    </div>

    <!-- Task Items Feed -->
    <div class="task-stream" id="task-feed"></div>

  </div>

  <!-- Dynamic Toast Notification -->
  <div class="toast-pill" id="app-toast">
    <div class="toast-beacon"></div>
    <span id="toast-text">Submission deadline reached!</span>
  </div>

  <script>
    // State
    let taskList = JSON.parse(localStorage.getItem("pulsetask_store")) || [];
    let activeFilter = "all";
    let searchQuery = "";

    // Web Audio Synthesized Chime (No External MP3)
    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const note = (freq, start, duration) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
          gain.gain.setValueAtTime(0.18, ctx.currentTime + start);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + start);
          osc.stop(ctx.currentTime + start + duration);
        };
        // Harmonic 3-tone chime
        note(523.25, 0.0, 0.35); // C5
        note(659.25, 0.12, 0.4); // E5
        note(783.99, 0.24, 0.6); // G5
      } catch (e) {
        console.warn("Audio Context waiting for interaction", e);
      }
    }

    // System Push Notifications
    function activateNotifications() {
      if (!("Notification" in window)) return;
      Notification.requestPermission().then(() => {
        refreshNotificationBtn();
        showToast("Reminder alerts are active!");
      });
    }

    function refreshNotificationBtn() {
      const btn = document.getElementById("notif-btn");
      const label = document.getElementById("notif-label");
      if (Notification.permission === "granted") {
        btn.classList.add("active");
        label.innerText = "Reminders Active";
      } else {
        btn.classList.remove("active");
        label.innerText = "Enable Reminders";
      }
    }

    function showToast(msg) {
      const toast = document.getElementById("app-toast");
      document.getElementById("toast-text").innerText = msg;
      toast.classList.add("active");
      setTimeout(() => toast.classList.remove("active"), 4500);
    }

    // CRUD Ops
    function persist() {
      localStorage.setItem("pulsetask_store", JSON.stringify(taskList));
      recalculateStats();
      renderFeed();
    }

    function handleNewTask(e) {
      e.preventDefault();
      const input = document.getElementById("composer-input");
      const time = document.getElementById("composer-time");
      const prio = document.getElementById("composer-priority");
      const offset = document.getElementById("composer-offset");

      const task = {
        id: "task_" + Date.now(),
        title: input.value.trim(),
        deadline: new Date(time.value).toISOString(),
        priority: prio.value,
        offset: parseInt(offset.value),
        completed: false,
        alertSent: false
      };

      taskList.unshift(task);
      persist();

      input.value = "";
      time.value = "";
      showToast("Task scheduled!");
    }

    function toggleComplete(id) {
      taskList = taskList.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      persist();
    }

    function removeTask(id) {
      taskList = taskList.filter(t => t.id !== id);
      persist();
    }

    function setFilter(filter, el) {
      activeFilter = filter;
      document.querySelectorAll(".filter-tab").forEach(tab => tab.classList.remove("active"));
      el.classList.add("active");
      renderFeed();
    }

    function handleFilterSearch(val) {
      searchQuery = val.toLowerCase().trim();
      renderFeed();
    }

    // Metrics Calculation
    function recalculateStats() {
      const total = taskList.length;
      const completed = taskList.filter(t => t.completed).length;
      const pending = total - completed;

      const todayStart = new Date();
      todayStart.setHours(0,0,0,0);
      const todayEnd = new Date(todayStart);
      todayEnd.setDate(todayEnd.getDate() + 1);

      const dueToday = taskList.filter(t => {
        const d = new Date(t.deadline);
        return d >= todayStart && d < todayEnd && !t.completed;
      }).length;

      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById("metric-percent").innerText = `${percent}%`;
      document.getElementById("metric-progress").style.width = `${percent}%`;
      document.getElementById("metric-today").innerText = dueToday;
      document.getElementById("metric-pending").innerText = pending;
      document.getElementById("metric-finished").innerText = completed;
    }

    // Time calculations
    function calculateTimeDelta(isoString) {
      const diff = new Date(isoString).getTime() - Date.now();
      const isPast = diff < 0;
      const absDiff = Math.abs(diff);

      const mins = Math.floor((absDiff / (1000 * 60)) % 60);
      const hours = Math.floor((absDiff / (1000 * 60 * 60)) % 24);
      const days = Math.floor(absDiff / (1000 * 60 * 60 * 24));

      let str = "";
      if (days > 0) str = `${days}d ${hours}h`;
      else if (hours > 0) str = `${hours}h ${mins}m`;
      else str = `${mins}m`;

      return {
        label: isPast ? `${str} overdue` : `in ${str}`,
        isOverdue: isPast
      };
    }

    function formatTimeDisplay(iso) {
      return new Date(iso).toLocaleDateString(undefined, {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    // Render Stream
    function renderFeed() {
      const container = document.getElementById("task-feed");
      container.innerHTML = "";

      let list = taskList.filter(t => {
        if (activeFilter === "pending") return !t.completed;
        if (activeFilter === "completed") return t.completed;
        if (activeFilter === "today") {
          return new Date(t.deadline).toDateString() === new Date().toDateString();
        }
        return true;
      });

      if (searchQuery) {
        list = list.filter(t => t.title.toLowerCase().includes(searchQuery));
      }

      // Sort
      list.sort((a, b) => {
        if (a.completed === b.completed) return new Date(a.deadline) - new Date(b.deadline);
        return a.completed ? 1 : -1;
      });

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state glass-surface">
            <div class="empty-halo">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <h3>Feed Clear & Up-to-Date</h3>
            <p>No tasks matched this view. Schedule a daily task or submission deadline to track it live!</p>
          </div>
        `;
        return;
      }

      list.forEach(task => {
        const delta = calculateTimeDelta(task.deadline);
        const card = document.createElement("div");
        card.className = `task-card glass-surface ${task.completed ? "is-done" : ""}`;

        card.innerHTML = `
          <div class="task-left">
            <div class="checkbox-glow" onclick="toggleComplete('${task.id}')">
              <svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="task-details">
              <span class="task-title">${escapeHtml(task.title)}</span>
              <div class="tag-cluster">
                <span class="tag tag-priority-${task.priority}">${task.priority}</span>
                <span class="tag tag-countdown">${formatTimeDisplay(task.deadline)}</span>
                ${!task.completed ? `
                  <span class="tag ${delta.isOverdue ? 'tag-overdue' : 'tag-countdown'}">
                    ${delta.label}
                  </span>
                ` : ''}
              </div>
            </div>
          </div>
          <button class="btn-delete" title="Delete" onclick="removeTask('${task.id}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        `;

        container.appendChild(card);
      });
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.innerText = str;
      return d.innerHTML;
    }

    // High Accuracy Reminder Watcher
    function reminderEngine() {
      const now = Date.now();
      taskList.forEach(task => {
        if (!task.completed && !task.alertSent) {
          const triggerTime = new Date(task.deadline).getTime() - (task.offset * 60 * 1000);
          if (now >= triggerTime) {
            task.alertSent = true;
            persist();

            playChime();
            showToast(`Submission Deadline: ${task.title}`);

            if (Notification.permission === "granted") {
              new Notification("Task Submission Alert!", {
                body: `It is time to submit: "${task.title}"`,
                icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>"
              });
            }
          }
        }
      });
    }

    // Init
    document.addEventListener("DOMContentLoaded", () => {
      // Default time input to 1 hour ahead
      const nextHour = new Date();
      nextHour.setHours(nextHour.getHours() + 1);
      nextHour.setMinutes(0, 0, 0);
      nextHour.setMinutes(nextHour.getMinutes() - nextHour.getTimezoneOffset());
      document.getElementById("composer-time").value = nextHour.toISOString().slice(0, 16);

      refreshNotificationBtn();
      persist();
      setInterval(reminderEngine, 3000);
    });
  </script>
</body>
</html>
